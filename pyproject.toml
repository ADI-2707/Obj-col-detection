[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "orbix"
version = "1.5.0"
description = "Intelligent Measurement for Modern Mills"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "ultralytics>=8.3,<9",
    "supervision>=0.25,<1",
    "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[project.scripts]
orbix = "orbix.__main__:main"

[tool.setuptools.packages.find]
include = ["orbix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
